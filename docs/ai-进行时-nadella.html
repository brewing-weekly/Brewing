<h2>AI 进行时</h2>

<p><a href="https://x.com/satyanadella/status/2108931348857827686">Nadella：模型是企业内部风险，要用确定性系统围住它</a></p>

<p>**用确定性系统包围非确定性模型。** 我日常让 AI 干活也是这个路数：从不指望模型一次做对，而是用检查清单和留痕把它围住。微软 CEO 把这套东西写成治理原则，说明这不是个人习惯，是行业正在形成的共识。</p>

<p>原文：Satya Nadella《Models as Insider Risks in the Super Intelligence Era》，2026-10-10。</p>
